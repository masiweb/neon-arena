name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "server/static/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rebuild and verify renderer bundle
        run: |
          npm ci
          npm run build:renderer
          npm run check:renderer
          git diff --exit-code -- server/static/renderer3d.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace -PgameServerOrigin=https://game.chanelchat.ir

      - name: Verify signature and embedded server
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/game.js > /tmp/neon-game.js
          grep -Fq "https://game.chanelchat.ir" /tmp/neon-game.js
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq "assets/assets/models/soldier.gltf"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq "assets/assets/textures/brick_color.webp"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-arena-android-v5.0.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
