plugins {
    id "com.android.application"
}

def gameServerOrigin = providers.gradleProperty("gameServerOrigin")
    .orElse("https://game.chanelchat.ir")

android {
    namespace "ir.chanelchat.neonarena"
    compileSdk 35

    defaultConfig {
        applicationId "ir.chanelchat.neonarena"
        minSdk 24
        targetSdk 35
        versionCode 220
        versionName "2.2.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-test"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("syncGameAssets", Copy) {
    from("../../server/static") {
        include "index.html", "styles.css", "game.js", "renderer3d.js"
    }
    into("src/main/assets")
    filter { String line ->
        line
            .replace('href="/static/styles.css?v=2.2.0"', 'href="styles.css?v=2.2.0"')
            .replace('src="/static/renderer3d.js?v=2.2.0"', 'src="renderer3d.js?v=2.2.0"')
            .replace('src="/static/game.js?v=2.2.0"', 'src="game.js?v=2.2.0"')
            .replace('__NEON_SERVER_ORIGIN__', gameServerOrigin.get())
    }
}

preBuild.dependsOn(syncGameAssets)
